  // Ensure exactly 84 entries – but we need 102. We'll pad with some distinct area questions from remaining pages (keeping original numbering)

  ];

  const allQuestions = questions.concat(extra); // 84 + 18 = 102
  window.questions = allQuestions;

  // ----- QUIZ LOGIC (identical to original) -----
  let current = 0;
  const userAnswers = {};
  const seenQuestions = new Set();
  const startTime = new Date();
  let navPanelVisible = false;

  function renderQuestion(index) {
    const q = window.questions[index];
    const container = document.getElementById("quiz-content");
    container.innerHTML = `
      <div class="question-number">${q.number}</div>
      <div class="question">${q.text}</div>
      <div class="options">
        ${q.options.map((opt, i) => {
          const id = `q${index}_${String.fromCharCode(65 + i)}`;
          const checked = userAnswers[index] === String.fromCharCode(65 + i) ? "checked" : "";
          return `
            <input type="radio" id="${id}" name="mcq${index}" value="${String.fromCharCode(65 + i)}" ${checked}>
            <label for="${id}">${String.fromCharCode(65 + i)}) ${opt}</label>
          `;
        }).join("")}
      </div>
    `;
    seenQuestions.add(index);
    document.getElementById("backBtn").style.display = index === 0 ? "none" : "inline-block";
    document.getElementById("nextBtn").style.display = index === window.questions.length - 1 ? "none" : "inline-block";
    document.getElementById("submitBtn").style.display = index === window.questions.length - 1 ? "inline-block" : "none";
    updateNavPanel();
  }

  function updateNavPanel() {
    const qList = document.getElementById("questionList");
    qList.innerHTML = '';
    window.questions.forEach((q, i) => {
      const it = document.createElement("div");
      it.className = "question-item";
      it.textContent = i+1;
      if (userAnswers[i]) it.classList.add("answered");
      else if (seenQuestions.has(i)) it.classList.add("seen");
      else it.classList.add("not-seen");
      if (i === current) it.classList.add("current");
      it.onclick = () => { saveAnswer(); current = i; renderQuestion(current); toggleNavPanel(); };
      qList.appendChild(it);
    });
  }

  window.toggleNavPanel = function() {
    const panel = document.getElementById("navPanel");
    navPanelVisible = !navPanelVisible;
    panel.style.display = navPanelVisible ? "block" : "none";
  };

  function saveAnswer() {
    const selected = document.querySelector(`input[name="mcq${current}"]:checked`);
    if (selected) userAnswers[current] = selected.value;
  }

  window.nextQuestion = function() { saveAnswer(); if (current < window.questions.length-1) { current++; renderQuestion(current); } };
  window.prevQuestion = function() { saveAnswer(); if (current > 0) { current--; renderQuestion(current); } };
  window.submitQuiz = function() {
    saveAnswer();
    let correct = 0;
    window.questions.forEach((q,i) => { if (userAnswers[i] === q.correct) correct++; });
    alert(`Quiz submitted! Correct: ${correct} / ${window.questions.length}`);
  };

  renderQuestion(0);
  let min=0, sec=0;
  setInterval(() => { sec++; if(sec===60){ sec=0; min++; } document.getElementById("timer").innerText = `${min.toString().padStart(2,'0')}:${sec.toString().padStart(2,'0')}`; }, 1000);
</script>
