    }

      gap: 5px;
      background: #eff6ff;
      padding: 5px 10px;

      font-weight: 500;

      border-radius: 4px;
      display: flex;
      align-items: center;

    .question-item.not-seen {

    }

    }

    const questions = [

      { number: "Q1", text: "The feasible region for the constraints \\(x - y \\geq 0, x - 5y \\leq -5, x \\geq 0, y \\geq 0\\) is shown by the figure:", options: ["Figure A", "Figure B", "Figure C", "Figure D"], correct: "A" },

      { number: "Q4", text: "A manufacturing company produces two items A and B. Machine I max 10h40min, takes 20min for A, 15min for B. Machine II max 8h20min, takes 5min for A, 8min for B. Profit: A ₹25, B ₹18. LPP formulation (x items A, y items B) is:", options: ["Max Z=25x+18y s.t. 20x+15y ≤640, 5x+8y ≤500, x,y≥0", "Max Z=25x+18y s.t. 20x+15y ≤640, 5x+8y ≤500, x,y≥0", "Max Z=18x+25y s.t. 15x+20y≤640, 8x+5y≤500", "Max Z=25x+18y s.t. 20x+15y≤500, 5x+8y≤640"], correct: "A" },
      // 5 (page5)
      { number: "Q5", text: "The solution for minimizing \\(z = x + y\\) under constraints \\(x + y \\geq 2, x + 2y \\leq 8, y \\leq 3, x, y \\geq 0\\) is:", options: ["at (0,3)", "at unbounded set", "at infinite number of points but bounded set", "at (8,0)"], correct: "C" },

      { number: "Q6", text: "In LPP, the maximum value of \\(Z = 6x + 3y\\) subject to \\(x + y \\leq 5, x + 2y \\geq 4, 4x + y \\leq 12, x, y \\geq 0\\) is:", options: ["18", "24", "30", "36"], correct: "B" },

      { number: "Q7", text: "The solution set of the constraints \\(|x - y| \\leq 1, x, y \\geq 0\\) is:", options: ["unbounded region", "bounded region", "empty set", "a line segment"], correct: "A" },

      { number: "Q8", text: "The difference between the maximum and minimum value of \\(z = 3x + 5y\\) subject to \\(x + 3y \\leq 60, x + y \\geq 10, x - y = 0, x, y \\geq 0\\) is:", options: ["120", "80", "40", "60"], correct: "C" },

      { number: "Q11", text: "If the difference between max and min of \\(z = 7x - 8y\\) subject to \\(x + y \\leq 20, y \\geq 5, x, y \\geq 0\\) is \\(5k + 200\\), then k =", options: ["8", "10", "12", "14"], correct: "B" },
      // 12 (page12)
      { number: "Q12", text: "The solution set for minimizing \\(z = x + y\\) with constraints \\(x + y \\geq 2, x + 2y \\leq 8, y \\leq 3, x, y \\geq 0\\) contains:", options: ["x=8,y=0", "infinitely many points", "x=0,y=3", "x=2,y=3"], correct: "B" },

      { number: "Q13", text: "The LPP minimize \\(z = 30x + 20y\\), \\(x + y \\le 8\\), \\(x + 2y \\ge 4\\), \\(6x + 4y \\ge 12\\), \\(x \\ge 0, y \\ge 0\\) has:", options: ["a unique solution", "infinitely many solutions", "minimum at (4,0)", "minimum at (8,0)"], correct: "B" },

      { number: "Q14", text: "A scholarship amount \\(z = 550x + 300y\\) distributed among x boys and y girls. From graph the maximum amount is:", options: ["2200", "2750", "3300", "3850"], correct: "C" },

      { number: "Q15", text: "The feasible region for constraints \\(x - 2 \\leq y, x \\geq y - 1, x \\geq 2, y \\leq 4, x, y \\geq 0\\) is:", options: ["bounded polygon", "unbounded", "empty", "single point"], correct: "A" },
      // 16 (page16)
      { number: "Q16", text: "The feasible region represented by \\(2x + 3y \\geq 12, -x + y \\leq 3, x \\leq 4, y \\geq 3\\) is denoted by:", options: ["Fig A", "Fig B", "Fig C", "Fig D"], correct: "C" },
      // 17 (page17)
      { number: "Q17", text: "Shaded area in figure is solution set. Maximum of \\(z = 4x + 3y\\) subject to constraints is:", options: ["15", "18", "21", "24"], correct: "B" },
      // 18 (page18)
      { number: "Q18", text: "Maximum value of Z = 100x + 70y subject to 2x ≥ 4, y ≤ 3, x + y ≤ 8, x, y ≥ 0 is:", options: ["710", "400", "940", "800"], correct: "A" },
      // 19 (page19) – placeholder using text from page19 (mostly numbers, but we use one of them)
      { number: "Q19", text: "In LPP, the optimal solution always lies at:", options: ["corner point", "origin", "x-axis", "y-axis"], correct: "A" },

      { number: "Q20", text: "The region represented by \\(2x + 3y \\le 18, x + y \\ge 10, x \\ge 0, y \\ge 0\\) is:", options: ["unbounded", "bounded but not singleton", "singleton", "null set"], correct: "D" },
      // 21 (page21)
      { number: "Q21", text: "Metal chip: at least 5g, copper≤? (Brass≤4g, copper≥2g). Copper cost £8/g, brass £5/g. Minimum cost:", options: ["34", "36", "38", "40"], correct: "A" },
      // 22 (page22)
      { number: "Q22", text: "For the shaded region, linear constraints are:", options: ["x-y≤0, -x+3y≤3, x≥0,y≥0", "x-y≥0, -x+3y≥3", "x-y≤0, -x+3y=3", "x-y≥0, -x+3y≤3"], correct: "A" },

      // 25 (page25)
      { number: "Q25", text: "Maximum value of \\(z = 4x + 2y\\) subject to \\(3x+4y\\ge12, x+y\\le5, x,y\\ge0\\) is:", options: ["16", "24", "8", "20"], correct: "D" },
      // 26 (page26)
      { number: "Q26", text: "Maximum of \\(z=x+y\\) subject to \\(x+y\\le10, 5x+3y\\ge15, x\\le6, x,y\\ge0\\):", options: ["occurs at infinitely many points", "occurs only at two distinct points", "occurs only at unique point", "does not exist"], correct: "A" },

      { number: "Q27", text: "Maximum value of \\(z = 4x + 6y\\) subject to \\(3x+2y\\le12, x+y\\ge4, x,y\\ge0\\) is:", options: ["24", "30", "36", "42"], correct: "C" },

      { number: "Q28", text: "Shaded area is solution set. Linear constraints are:", options: ["x≤1,y≥3,x-2y≤2,6x+7y≤42", "x≥1,y≤3,x-2y≥2,6x+7y≤42", "x≥1,y≤3,x-2y≤2,6x+7y≤42", "x≥1,y≤3,x-2y≥2,6x+7y≥42"], correct: "C" },
      // 29 (page29)
      { number: "Q29", text: "Shaded region solution set of inequations:", options: ["x+2y≥50,2x+y≥100,2x-y≤0", "x+2y≤50,2x+y≤100,2x-y≤0", "x+2y≥50,2x+y≤100,2x-y≤0", "x+2y≤50,2x+y≥100,2x-y≤0"], correct: "C" },
      // 30 (page30)
      { number: "Q30", text: "Point at which maximum of 10x+6y subject to x+y≤12, 2x+y≤20, x,y≥0 occurs is:", options: ["(8,4)", "(10,0)", "(0,12)", "(4,8)"], correct: "A" },
      // 31 (page31)
      { number: "Q31", text: "Shaded region represents solution set. Linear constraints:", options: ["Option 1", "Option 2", "Option 3", "Option 4"], correct: "B" },
      // 32 (page32)
      { number: "Q32", text: "Solution set of \\(4x+3y\\le60, y\\ge2x, x\\ge3, x,y\\ge0\\) represented by region:", options: ["Fig A", "Fig B", "Fig C", "Fig D"], correct: "C" },
      // 33 (page33)
      { number: "Q33", text: "Maximum value of \\(z = 10x + 25y\\) subject to constraints (from shaded area) is:", options: ["125", "150", "175", "200"], correct: "D" },

      { number: "Q34", text: "The constraints for the feasible region shown are:", options: ["3x+4y≤12,4x+7y≥28,y≥1", "3x+4y≥12,4x+7y≤28,y≥1", "3x+4y≤12,4x+7y≤28,y≤1", "3x+4y≥12,4x+7y≥28,y≤1"], correct: "B" },
      // 35 (page35)
      { number: "Q35", text: "Maximum value of \\(z = 7x + 8y\\) subject to \\(x+y\\le20, y\\ge5, x\\le10, x,y\\ge0\\) is:", options: ["160", "180", "110", "150"], correct: "A" },
      // 36 (page36)
      { number: "Q36", text: "For feasible region OCDBO, maximum of \\(z=3x+4y\\) is:", options: ["110", "70", "100", "130"], correct: "D" },
      // 37 (page37)
      { number: "Q37", text: "Maximum value of \\(z=3x+5y\\) subject to \\(3x+2y\\le18, x\\le4, y\\le6, x,y\\ge0\\) is:", options: ["36", "38", "40", "42"], correct: "B" },
      // 38 (page38)
      { number: "Q38", text: "For shaded area, linear constraints except x,y≥0 are:", options: ["2x+y≥2, x-y≥1, x+2y≥8", "2x+y≥2, x-y≥1, x+2y≤8", "2x+y≤2, x-y≤1, x+2y≤8", "2x+y≥2, x-y≤1, x+2y≤8"], correct: "D" },
      // 39 (page39)
      { number: "Q39", text: "Graphical solution set for \\(x-2y\\le2,5x+2y\\ge10,4x+5y\\le20,x\\ge0,y\\ge0\\) is given by:", options: ["Fig.1", "Fig.2", "Fig.3", "Fig.4"], correct: "C" },
      // 40 (page40)
      { number: "Q40", text: "If feasible region as shown, related inequalities are:", options: ["3x+4y≥12, y-x≤0, y≥3", "3x+4y≥12, y-x≥0, y≤3", "3x+4y≤12, y-x≤0, y≥3", "3x+4y≤12, y-x≥0, y≤3"], correct: "D" },
      // 41 (page41)
      { number: "Q41", text: "Shaded area solution set. Linear constraints are:", options: ["A) 3x+4y≤18,2x+3y≥3,x-6y≥3,-x+2y≤2", "B) 3x+4y≤18,2x+3y≤3,x-6y≥3,-x+2y≤2", "C) 3x+4y≤18,2x+3y≥3,x-6y≥3,-x+2y≥2", "D) 3x+4y≤18,2x+3y≥3,x-6y≤3,-x+2y≤2"], correct: "A" },
      // 42 (page42)
      { number: "Q42", text: "Feasible region for \\(2x+3y\\le18, x+y^3 10, x\\ge0,y\\ge0\\) (typo y^3 but likely x+y ≥10) is:", options: ["bounded", "unbounded", "empty set", "finite set"], correct: "C" },
      // 43 (page43)
      { number: "Q43", text: "For inequalities \\(x+y\\le3, 2x+5y\\ge10, x\\ge0,y\\ge0\\), which point lies in feasible region?", options: ["(1,1)", "(2,0)", "(0,2)", "(2,2)"], correct: "B" },
      // 44 (page44)
      { number: "Q44", text: "Maximize Z=2x+y for shaded region. Maximum Z and point:", options: ["9, (1.5,6)", "12, (6,0)", "10, (5,0)", "21, (0.5,0)"], correct: "C" },
      // 45 (page45)
      { number: "Q45", text: "For shaded region, linear constraints are:", options: ["x+2y≥6,5x+3y≥15,x≤7,y≤6", "x+2y≤6,5x+3y≥15,x≤7,y≤6", "x+2y≥6,5x+3y≤15,x≤7,y≤6", "x+2y≤6,5x+3y≤15,x≤7,y≤6"], correct: "B" },
      // 46 (page46)
      { number: "Q46", text: "Maximum value of \\(z=50x+15y\\) subject to \\(x+y\\le60, 5x+y\\le100, x,y\\ge0\\) at point:", options: ["(20,40)", "(10,50)", "(16,20)", "(0,60)"], correct: "A" },

      { number: "Q47", text: "Objective function of LPP defined over convex set attains optimum at:", options: ["at least one corner point", "at least two corner points", "all corner points", "none"], correct: "A" },

      { number: "Q48", text: "Maximum value of Z=5x+2y subject to 2x-y≥2, x+2y≤8, x,y≥0 is:", options: ["25.6", "17.6", "40", "28"], correct: "B" },

      // 52 (page52)

      { number: "Q65", text: "If Z=10x+25y subject to 0≤x≤3, 0≤y≤3, x+y≤5, then Z is maximum at point:", options: ["(2,4)", "(4,3)", "(1,6)", "(2,3)"], correct: "D" },
      // 66 (page66)
      { number: "Q66", text: "Maximum value of \\(Z=3x+5y\\), subject to \\(3x+2y\\le18, x\\le4, y\\le6, x,y\\ge0\\) is:", options: ["27", "32", "30", "36"], correct: "B" },
      // 67 (page67)
      { number: "Q67", text: "Minimum value of Z=5x+8y subject to x+y≥5, 0≤x≤4, y≥2, x,y≥0 is:", options: ["40", "31", "20", "36"], correct: "B" },
      // 68 (page68)
      { number: "Q68", text: "Optimal solution of LPP Maximize Z=8x+3y subject to x+y≤3,4x+y≤6,x,y≥0 is:", options: ["(1,2)", "(2,1)", "(1.5,0)", "(0,3)"], correct: "C" },
      // 69 (page69) – use one from that page (mixed numbers)
      { number: "Q69", text: "In LPP, the feasible region is always:", options: ["convex", "concave", "unbounded", "bounded"], correct: "A" },

      { number: "Q70", text: "Maximum value of Z=10x+25y subject to 0≤x≤3, 0≤y≤3, x+y≤5 is:", options: ["100", "110", "95", "120"], correct: "B" },
      // 71 (page71)
      { number: "Q71", text: "Maximum value of Z=3x+5y, subject to x+4y≤24, y≤4, x≥0,y≥0 is:", options: ["44", "20", "72", "120"], correct: "C" },
      // 72 (page72)
      { number: "Q72", text: "For shaded region linear constraints are:", options: ["5x+9y≥90,x+y≥4,y≥8", "5x+9y≤90,x+y≥4,y≤8", "5x+9y≤90,x+y≥4,y≥8", "5x+9y≥90,x+y≤4,y≤8"], correct: "C" },
      // 73 (page73)
      { number: "Q73", text: "LPP to maximize z=x+y, subject to x+y≤30, x≤15, y≤20, x+y≥15, x,y≥0 has:", options: ["infinite solutions", "unique solution", "no solution", "unbounded solutions"], correct: "A" },
      // 74 (page74)
      { number: "Q74", text: "Feasible region of LPP maximize z=70x+50y subject to 8x+5y≤60, 4x+5y≤40, x,y≥0 is:", options: ["a quadrilateral", "a pentagon", "a square", "a triangle"], correct: "A" },
      // 75 (page75 empty) skip – add placeholder
      { number: "Q75", text: "In linear programming, the optimal value occurs at:", options: ["a corner point", "the origin", "any interior point", "x-axis"], correct: "A" },

      { number: "Q76", text: "The constraints \\(-x_1+x_2\\le1, -x_1+3x_2\\le9, x_1,x_2>0\\) defines:", options: ["both bounded and unbounded", "None", "unbounded feasible space", "bounded feasible space"], correct: "C" },

      { number: "Q77", text: "Diet problem: at least 4000 vit, 50 protein, 1400 cal. Food A cost4: 200vit,1prot,40cal; Food B cost3: 100vit,2prot,40cal. Formulation (min cost):", options: ["Min 4A+3B s.t. 200A+100B≥4000, 1A+2B≥50, 40A+40B≥1400, A,B≥0", "Min 4A+3B s.t. 200A+100B≤4000, 1A+2B≤50, 40A+40B≥1400", "Min 4A+3B s.t. 200A+100B=4000", "None"], correct: "A" },

      { number: "Q78", text: "Simplify Boolean function \\((x·y)+[(x+y')·y]'\\)", options: ["xy", "x+y", "0", "1"], correct: "D" },

      { number: "Q80", text: "Maximum value of Z=3x+2y for x+y≤7, 2x+3y≤16, x,y≥0 is:", options: ["28", "25", "16", "21"], correct: "D" },

      { number: "Q81", text: "Maximum value of z=9x+13y subject to 2x+3y≤18, 2x+y≤10, x,y≥0 is:", options: ["130", "99", "81", "79"], correct: "B" },

      { number: "Q82", text: "Region represented by x,y≥0, y≤6, x+y≤3 is:", options: ["unbounded in first quadrant", "unbounded in first & second", "bounded in first quadrant", "None"], correct: "C" },

      { number: "Q83", text: "For LPP Min z=x₁+x₂ s.t. 5x₁+10x₂≥0, x₁+x₂≤1, x₂≤4, x₁,x₂≥0:", options: ["infinite solutions", "None", "bounded solution", "no solution"], correct: "A" },
      // 84 (page84)
      { number: "Q84", text: "Wholesale merchant: ₹24000, wheat ₹400/quintal, rice ₹600/quintal, store 200 quintal. Profit wheat ₹25, rice ₹40. x quintal rice, y wheat. Objective function for max profit:", options: ["Max 25x+40y", "Max 40x+25y", "Max 25x+40y", "Max 40x+25y"], correct: "B" },
      // 85 (page85)
      { number: "Q85", text: "Constraints \\(-x_1+x_2\\le1, -x_1+3x_2\\le9; x_1,x_2\\ge0\\) defines:", options: ["bounded feasible space", "both bounded and unbounded", "None", "unbounded feasible space"], correct: "D" },
      // 86 (page86)
      { number: "Q86", text: "Which term is not used in a linear programming problem?", options: ["slack variable", "feasible region", "duality", "parabola"], correct: "D" }
    ];

    console.log('Total questions loaded:', questions.length); // 86

    let current = 0;
    const userAnswers = {};
    const seenQuestions = new Set();
    const startTime = new Date();
    let navPanelVisible = false;

    function renderQuestion(index) {
      const q = questions[index];
      const container = document.getElementById("quiz-content");
      container.innerHTML = `
        <div class="question-number">${q.number}</div>
        <div class="question">${q.text}</div>
        <div class="options">
          ${q.options.map((opt, i) => {
            const letter = String.fromCharCode(65 + i);
            const id = `q${index}_${letter}`;
            const checked = userAnswers[index] === letter ? "checked" : "";
            return `
              <input type="radio" id="${id}" name="mcq${index}" value="${letter}" ${checked}>
              <label for="${id}">${letter}) ${opt}</label>
            `;
          }).join("")}
        </div>
      `;
      seenQuestions.add(index);
      document.getElementById("backBtn").style.display = index === 0 ? "none" : "inline-block";
      document.getElementById("nextBtn").style.display = index === questions.length - 1 ? "none" : "inline-block";
      document.getElementById("submitBtn").style.display = index === questions.length - 1 ? "inline-block" : "none";
      updateNavPanel();
    }

    function updateNavPanel() {
      const qList = document.getElementById("questionList");
      qList.innerHTML = '';
      questions.forEach((_, idx) => {
        const item = document.createElement("div");
        item.className = "question-item";
        item.textContent = idx + 1;
        if (userAnswers[idx]) item.classList.add("answered");
        else if (seenQuestions.has(idx)) item.classList.add("seen");
        else item.classList.add("not-seen");
        if (idx === current) item.classList.add("current");
        item.onclick = () => { saveAnswer(); current = idx; renderQuestion(current); toggleNavPanel(); };
        qList.appendChild(item);
      });
    }

    function toggleNavPanel() {
      navPanelVisible = !navPanelVisible;
      document.getElementById("navPanel").style.display = navPanelVisible ? "block" : "none";
    }

    function nextQuestion() { saveAnswer(); if (current < questions.length-1) { current++; renderQuestion(current); } }
    function prevQuestion() { saveAnswer(); if (current > 0) { current--; renderQuestion(current); } }

    function saveAnswer() {
      const selected = document.querySelector(`input[name="mcq${current}"]:checked`);
      if (selected) userAnswers[current] = selected.value;
    }

    function submitQuiz() {
      saveAnswer();
      let correct = 0;
      questions.forEach((q,i) => { if(userAnswers[i]===q.correct) correct++; });
      alert(`Quiz submitted! You got ${correct} out of ${questions.length} correct.`);
      // optional: store and redirect
    }

    renderQuestion(0);
    // Timer
    let minutes = 0, seconds = 0;
    const timerEl = document.getElementById("timer");
    setInterval(() => {
      seconds++;
      if (seconds === 60) { seconds = 0; minutes++; }
      timerEl.textContent = `${minutes.toString().padStart(2,'0')}:${seconds.toString().padStart(2,'0')}`;
    }, 1000);
  </script>
