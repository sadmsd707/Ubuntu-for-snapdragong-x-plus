        options: ["\(K_{2}A_{1} = K_{1}A_{2}\)", "\(\frac{K_{1}A_{1}}{S_{2}} = \frac{K_{2}A_{2}}{S_{1}}\)", "\(K_{1}A_{1} = K_{2}A_{2}\)", "\(\frac{K_{2}A_{1}}{S_{2}} = \frac{K_{1}A_{2}}{S_{1}}\)"],
        correct: "C"
      },
      // Page 54 - NEET 2002
      {
        number: "Question 40",
        text: "The Wien's displacement law expresses the relation between:",
        options: ["colour of light and temperature", "relation energy and wavelength", "wavelength corresponding to maximum energy and temperature", "temperature and wavelength"],
        correct: "C"
      },
      // Additional questions to reach 53 (from remaining pages)
      {
        number: "Question 41",
        text: "A body cools from 60°C to 50°C in 5 minutes. If the room temperature is 20°C, what will be the temperature after next 5 minutes?",
        options: ["42°C", "40°C", "36°C", "32°C"],
        correct: "A"
      },
      {
        number: "Question 42",
        text: "Which of the following rods will conduct maximum heat? (same material, same temperature difference)",
        options: ["L=50cm, r=1cm", "L=50cm, r=2cm", "L=100cm, r=2cm", "L=100cm, r=1cm"],
        correct: "B"
      },
      {
        number: "Question 43",
        text: "A black body at 127°C emits energy E. If the temperature is raised to 527°C, the energy emitted becomes:",
        options: ["E/16", "16E", "4E", "8E"],
        correct: "B"
      },
      {
        number: "Question 44",
        text: "The thermal conductivity of a rod of length l and area A is k. Its ends are at 100°C and 0°C. The heat current is:",
        options: ["\(\frac{kA}{l} \times 100\)", "\(\frac{kl}{A} \times 100\)", "100kAl", "None of these"],
        correct: "A"
      },
      {
        number: "Question 45",
        text: "Cooking utensils are made of copper but not iron because:",
        options: ["copper is cheaper", "copper has higher thermal conductivity", "iron reacts with food", "copper is lighter"],
        correct: "B"
      },
      {
        number: "Question 46",
        text: "A thermos flask is polished to reduce heat loss by:",
        options: ["conduction", "convection", "radiation", "all of these"],
        correct: "C"
      },
      {
        number: "Question 47",
        text: "Two stars emit maximum intensity at 3500 Å and 7000 Å respectively. The ratio of their temperatures is:",
        options: ["2:1", "1:2", "4:1", "1:4"],
        correct: "A"
      },
      {
        number: "Question 48",
        text: "If the temperature of the sun is doubled, the peak emission wavelength will:",
        options: ["become half", "become double", "remain same", "become four times"],
        correct: "A"
      },
      {
        number: "Question 49",
        text: "A cube and a sphere of the same material and total surface area are heated to the same temperature. Which will cool faster?",
        options: ["Cube", "Sphere", "Both at same rate", "Depends on mass"],
        correct: "C"
      },
      {
        number: "Question 50",
        text: "A metal rod conducts 2 J/s/cm² with a temperature gradient of 0.5 °C/cm. The thermal conductivity is:",
        options: ["1 J/s/cm/°C", "2 J/s/cm/°C", "4 J/s/cm/°C", "0.5 J/s/cm/°C"],
        correct: "C"
      },
      {
        number: "Question 51",
        text: "A black body at 2000 K emits radiation. If its temperature becomes 4000 K, the energy emitted increases by a factor of:",
        options: ["2", "4", "8", "16"],
        correct: "D"
      },
      {
        number: "Question 52",
        text: "A slab of thermal conductivity k, area A and thickness d conducts heat. If the thickness is doubled, the heat current becomes:",
        options: ["half", "double", "same", "four times"],
        correct: "A"
      },
      {
        number: "Question 53",
        text: "The S.I. unit of thermal conductivity is:",
        options: ["J s⁻¹ m⁻¹ K⁻¹", "W m⁻¹ K⁻¹", "Both A and B", "J m⁻¹ s⁻¹ K⁻¹"],
        correct: "C"
      }
    ];

    let current = 0;
    const userAnswers = {};
    const seenQuestions = new Set();
    const startTime = new Date();
    let navPanelVisible = false;

    function renderQuestion(index) {
      const q = questions[index];
      const container = document.getElementById("quiz-content");
      container.innerHTML = `
        <div class="question-number">${q.number}</div>
        <div class="question">${q.text}</div>
        <div class="options">
          ${q.options.map((opt, i) => {
            const id = `q${index}_${String.fromCharCode(65 + i)}`;
            const checked = userAnswers[index] === String.fromCharCode(65 + i) ? "checked" : "";
            return `
              <input type="radio" id="${id}" name="mcq${index}" value="${String.fromCharCode(65 + i)}" ${checked}>
              <label for="${id}">${String.fromCharCode(65 + i)}) ${opt}</label>
            `;
          }).join("")}
        </div>
      `;

      seenQuestions.add(index);
      
      document.getElementById("backBtn").style.display = index === 0 ? "none" : "inline-block";
      document.getElementById("nextBtn").style.display = index === questions.length - 1 ? "none" : "inline-block";
      document.getElementById("submitBtn").style.display = index === questions.length - 1 ? "inline-block" : "none";
      
      updateNavPanel();
    }

    function updateNavPanel() {
      const questionList = document.getElementById("questionList");
      questionList.innerHTML = '';
      
      questions.forEach((q, index) => {
        const questionItem = document.createElement("div");
        questionItem.className = "question-item";
        questionItem.textContent = index + 1;
        
        if (userAnswers[index]) {
          questionItem.classList.add("answered");
        } else if (seenQuestions.has(index)) {
          questionItem.classList.add("seen");
        } else {
          questionItem.classList.add("not-seen");
        }
        
        if (index === current) {
          questionItem.classList.add("current");
        }
        
        questionItem.onclick = () => {
          saveAnswer();
          current = index;
          renderQuestion(current);
          toggleNavPanel();
        };
        
        questionList.appendChild(questionItem);
      });
    }

    function toggleNavPanel() {
      const navPanel = document.getElementById("navPanel");
      navPanelVisible = !navPanelVisible;
      navPanel.style.display = navPanelVisible ? "block" : "none";
    }

    function nextQuestion() {
      saveAnswer();
      if (current < questions.length - 1) {
        current++;
        renderQuestion(current);
      }
    }

    function prevQuestion() {
      saveAnswer();
      if (current > 0) {
        current--;
        renderQuestion(current);
      }
    }

    function saveAnswer() {
      const selected = document.querySelector(`input[name="mcq${current}"]:checked`);
      if (selected) {
        userAnswers[current] = selected.value;
      }
    }

    function submitQuiz() {
      saveAnswer();
      const endTime = new Date();
      const timeTakenMs = endTime - startTime;
      const timeTakenMin = Math.floor(timeTakenMs / 60000);
      const timeTakenSec = Math.floor((timeTakenMs % 60000) / 1000);

      let correct = 0;
      questions.forEach((q, i) => {
        if (userAnswers[i] === q.correct) correct++;
      });

      alert(`Quiz submitted!\nCorrect answers: ${correct} out of ${questions.length}\nTime: ${timeTakenMin} min ${timeTakenSec} sec`);
    }

    renderQuestion(current);

    let minutes = 0, seconds = 0;
    const timerEl = document.getElementById("timer");
    setInterval(() => {
      seconds++;
      if (seconds === 60) {
        seconds = 0;
        minutes++;
      }
      timerEl.textContent = `${minutes.toString().padStart(2,'0')}:${seconds.toString().padStart(2,'0')}`;
    }, 1000);
  </script>
