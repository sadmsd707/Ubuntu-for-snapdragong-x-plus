    { number: "67", text: "A horizontal ray incident on a right‑angled prism of angle 6° (µ=1.5). Emergence angle :", options: ["6°", "4°", "8°", "2°"], correct: "A" },
    { number: "68", text: "A light ray enters a right‑angled prism at P with incidence 30°, travels parallel to base and emerges along AC. Refractive index of prism is :", options: ["1.5", "1.73", "1.33", "1.6"], correct: "B" },
    { number: "69", text: "A small telescope has objective 140 cm, eyepiece 5 cm. Magnifying power :", options: ["28", "32", "34", "17"], correct: "A" },
    { number: "70", text: "A lens made of 3 media. Object beyond 2f. Number of real images :", options: ["1", "2", "3", "4"], correct: "B" },
    { number: "71", text: "Set of colours coming out in air from figure :", options: ["Blue,Green,Yellow", "Yellow,Orange,Red", "All", "Orange,Red,Violet"], correct: "B" },
    { number: "72", text: "Equivalent focal length of combination of thin lenses (figure) :", options: ["20 cm", "30 cm", "40 cm", "50 cm"], correct: "C" },
    { number: "73", text: "Two media A and B speeds 1.5e8, 2.0e8 m/s. Critical angle from A to B :", options: ["sin⁻¹(0.75)", "sin⁻¹(0.5)", "sin⁻¹(0.66)", "sin⁻¹(0.33)"], correct: "A" },
    { number: "74", text: "Angle of emergence from prism n=√3 :", options: ["30°", "45°", "60°", "90°"], correct: "C" },
    { number: "75", text: "A beam of light from source L incident normally on mirror at distance x. Mirror rotated by θ, spot moves y. θ = ?", options: ["y/(2x)", "y/x", "x/(2y)", "x/y"], correct: "A" },
    { number: "76", text: "Astronomical telescope large magnification & resolution needs objective with :", options: ["large focal length & diameter", "small f & diameter", "large f, small dia", "small f, large dia"], correct: "A" },
    { number: "77", text: "Prism n=√2, angle 30°, one face silvered. Incidence angle for retracing path :", options: ["30°", "45°", "60°", "90°"], correct: "B" },
    { number: "78", text: "Person’s near point 50 cm, far point 400 cm. Lens for infinity far point :", options: ["-0.25 D", "+0.25 D", "-2.5 D", "+2.5 D"], correct: "A" },
    { number: "79", text: "Ratio of resolving powers λ₁=4000Å, λ₂=6000Å :", options: ["3:2", "9:4", "16:81", "8:27"], correct: "A" },
    { number: "80", text: "Thin prism 10°, n=1.42, combined with n=1.7 for no deviation. Second prism angle :", options: ["6°", "4°", "10°", "8°"], correct: "A" },
    { number: "81", text: "Match magnification m: A=-2, B=-1, C=+2, D=+½. Correct mapping :", options: ["A: a,d; B: b,c; C: b,d; D: b,c", "A: a,c; B: a,d; C: a,b; D: c,d", "A: c,d; B: b,d; C: b,c; D: a,d", "A: b,c; B: b,c; C: b,d; D: a,d"], correct: "A" },
    { number: "82", text: "Glass slab n=1.5, apparent depths 5 cm and 3 cm. Thickness :", options: ["8 cm", "10 cm", "12 cm", "15 cm"], correct: "C" },
    { number: "83", text: "In astronomical telescope, line L on objective, image length l by eyepiece. Magnification = ?", options: ["L/l", "l/L", "L/(2l)", "2l/L"], correct: "B" },
    { number: "84", text: "Prism angle 60°, incidence 45°, minimum deviation. δₘ and µ :", options: ["30°, √2", "45°, √2", "30°, 1.5", "45°, 1.5"], correct: "A" }
  ];

  // Exactly 84 questions
  console.assert(questions.length === 84, 'Should be 84 questions');

  let current = 0;
  const userAnswers = {};
  const seenQuestions = new Set();
  const startTime = new Date();
  let navPanelVisible = false;

  function renderQuestion(index) {
    const q = questions[index];
    const container = document.getElementById("quiz-content");
    container.innerHTML = `
      <div class="question-number">Question ${q.number}</div>
      <div class="question">${q.text}</div>
      <div class="options">
        ${q.options.map((opt, i) => {
          const id = `q${index}_${String.fromCharCode(65 + i)}`;
          const checked = userAnswers[index] === String.fromCharCode(65 + i) ? "checked" : "";
          return `
            <input type="radio" id="${id}" name="mcq${index}" value="${String.fromCharCode(65 + i)}" ${checked}>
            <label for="${id}">${String.fromCharCode(65 + i)}) ${opt}</label>
          `;
        }).join("")}
      </div>
    `;

    seenQuestions.add(index);
    document.getElementById("backBtn").style.display = index === 0 ? "none" : "inline-block";
    document.getElementById("nextBtn").style.display = index === questions.length - 1 ? "none" : "inline-block";
    document.getElementById("submitBtn").style.display = index === questions.length - 1 ? "inline-block" : "none";
    updateNavPanel();
  }

  function updateNavPanel() {
    const qList = document.getElementById("questionList");
    qList.innerHTML = '';
    questions.forEach((_, idx) => {
      const item = document.createElement("div");
      item.className = "question-item";
      item.textContent = idx + 1;
      if (userAnswers[idx]) item.classList.add("answered");
      else if (seenQuestions.has(idx)) item.classList.add("seen");
      else item.classList.add("not-seen");
      if (idx === current) item.classList.add("current");
      item.onclick = () => { saveAnswer(); current = idx; renderQuestion(current); toggleNavPanel(); };
      qList.appendChild(item);
    });
  }

  function toggleNavPanel() {
    const panel = document.getElementById("navPanel");
    navPanelVisible = !navPanelVisible;
    panel.style.display = navPanelVisible ? "block" : "none";
  }

  function nextQuestion() { saveAnswer(); if (current < questions.length-1) { current++; renderQuestion(current); } }
  function prevQuestion() { saveAnswer(); if (current > 0) { current--; renderQuestion(current); } }

  function saveAnswer() {
    const selected = document.querySelector(`input[name="mcq${current}"]:checked`);
    if (selected) userAnswers[current] = selected.value;
  }

  function submitQuiz() {
    saveAnswer();
    const end = new Date();
    const time = `${Math.floor((end-startTime)/60000)} min ${Math.floor(((end-startTime)%60000)/1000)} sec`;
    let correct = 0;
    questions.forEach((q,i) => { if (userAnswers[i] === q.correct) correct++; });
    localStorage.setItem("quizResults", JSON.stringify({
      total: questions.length, correct, accuracy: ((correct/questions.length)*100).toFixed(2), time,
      details: questions.map((q,i)=>({ number: q.number, userAns: userAnswers[i]||'N/A', correctAns: q.correct, isCorrect: userAnswers[i]===q.correct }))
    }));
    window.location.href = "results.html";
  }

  // Timer
  let minutes = 0, seconds = 0;
  const timerEl = document.getElementById("timer");
  setInterval(() => {
    seconds++;
    if (seconds === 60) { seconds = 0; minutes++; }
    timerEl.textContent = `${String(minutes).padStart(2,'0')}:${String(seconds).padStart(2,'0')}`;
  }, 1000);

  renderQuestion(current);
</script>
</body>
