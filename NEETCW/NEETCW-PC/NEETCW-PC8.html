  function renderQuestion(index) {
    const q = questions[index];
    const container = document.getElementById("quiz-content");
    container.innerHTML = `
      <div class="question-number">${q.number}</div>
      <div class="question">${q.text}</div>
      <div class="options">
        ${q.options.map((opt, i) => {
          const letter = String.fromCharCode(65 + i);
          const checked = userAnswers[index] === letter ? "checked" : "";
          return `
            <input type="radio" id="q${index}_${letter}" name="mcq${index}" value="${letter}" ${checked}>
            <label for="q${index}_${letter}">${letter}) ${opt}</label>
          `;
        }).join("")}
      </div>
    `;
    seenQuestions.add(index);
    document.getElementById("backBtn").style.display = index === 0 ? "none" : "inline-block";
    document.getElementById("nextBtn").style.display = index === questions.length - 1 ? "none" : "inline-block";
    document.getElementById("submitBtn").style.display = index === questions.length - 1 ? "inline-block" : "none";
    updateNavPanel();
  }

  function updateNavPanel() {
    const listDiv = document.getElementById("questionList");
    listDiv.innerHTML = "";
    questions.forEach((_, idx) => {
      const item = document.createElement("div");
      item.className = "question-item";
      if (userAnswers[idx]) item.classList.add("answered");
      else if (seenQuestions.has(idx)) item.classList.add("seen");
      else item.classList.add("not-seen");
      if (idx === current) item.classList.add("current");
      item.textContent = idx + 1;
      item.onclick = () => { saveAnswer(); current = idx; renderQuestion(current); toggleNavPanel(); };
      listDiv.appendChild(item);
    });
  }

  function toggleNavPanel() {
    navPanelVisible = !navPanelVisible;
    document.getElementById("navPanel").style.display = navPanelVisible ? "block" : "none";
  }

  function saveAnswer() {
    const selected = document.querySelector(`input[name="mcq${current}"]:checked`);
    if (selected) userAnswers[current] = selected.value;
  }

  function nextQuestion() { saveAnswer(); if (current < questions.length - 1) { current++; renderQuestion(current); } }
  function prevQuestion() { saveAnswer(); if (current > 0) { current--; renderQuestion(current); } }

  function submitQuiz() {
    saveAnswer();
    let correct = 0;
    questions.forEach((q, i) => { if (userAnswers[i] === q.correct) correct++; });
    const end = new Date();
    const diff = Math.floor((end - startTime) / 1000);
    const m = Math.floor(diff / 60);
    const s = diff % 60;
    alert(`Quiz submitted!\nCorrect: ${correct} / ${questions.length}\nTime: ${m} min ${s} sec`);
  }

  // timer
  let minutes = 0, seconds = 0;
  setInterval(() => {
    seconds++;
    if (seconds === 60) { seconds = 0; minutes++; }
    document.getElementById("timer").textContent = `${minutes.toString().padStart(2,'0')}:${seconds.toString().padStart(2,'0')}`;
  }, 1000);

  // start
  renderQuestion(0);
</script>
</body>
</html>
